<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="fk-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0b2545" />
    </marker>
    <filter id="tbl-shadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#0b2545" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- ================= BACKGROUND DECORATIONS (MATCHING TEMPLATE) ================= -->
  <!-- Top-Left Accent -->
  <g transform="translate(40, 30)">
    <rect x="0" y="40" width="14" height="90" rx="7" transform="rotate(-45 0 40)" fill="#f59e0b" />
    <rect x="35" y="20" width="16" height="130" rx="8" transform="rotate(-45 35 20)" fill="#0b2545" />
    <rect x="75" y="10" width="12" height="70" rx="6" transform="rotate(-45 75 10)" fill="#1e3a8a" />
    <g fill="#0b2545" opacity="0.85">
      <circle cx="10" cy="130" r="4" /><circle cx="30" cy="130" r="4" /><circle cx="50" cy="130" r="4" /><circle cx="70" cy="130" r="4" />
      <circle cx="10" cy="150" r="4" /><circle cx="30" cy="150" r="4" /><circle cx="50" cy="150" r="4" /><circle cx="70" cy="150" r="4" />
      <circle cx="10" cy="170" r="4" /><circle cx="30" cy="170" r="4" /><circle cx="50" cy="170" r="4" /><circle cx="70" cy="170" r="4" />
    </g>
  </g>

  <!-- Bottom-Right Accent -->
  <g transform="translate(1720, 880)">
    <circle cx="120" cy="120" r="90" fill="none" stroke="#0b2545" stroke-width="18" />
    <path d="M 40 140 A 100 100 0 0 1 140 40" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" />
    <circle cx="10" cy="60" r="14" fill="#0b2545" />
    <circle cx="-20" cy="110" r="10" fill="#f59e0b" />
    <circle cx="30" cy="140" r="8" fill="#1e3a8a" />
    <g fill="#0b2545" opacity="0.85">
      <circle cx="10" cy="170" r="4" /><circle cx="30" cy="170" r="4" /><circle cx="50" cy="170" r="4" />
      <circle cx="10" cy="190" r="4" /><circle cx="30" cy="190" r="4" /><circle cx="50" cy="190" r="4" />
      <circle cx="10" cy="210" r="4" /><circle cx="30" cy="210" r="4" /><circle cx="50" cy="210" r="4" />
    </g>
  </g>

  <!-- ================= TOP HEADER BANNER ================= -->
  <g transform="translate(380, 35)">
    <rect x="0" y="0" width="1160" height="70" rx="8" fill="#0b2545" filter="url(#tbl-shadow)" />
    <!-- Yellow Accent Chevron on Left -->
    <polygon points="12,12 45,35 12,58 30,35" fill="#f59e0b" />
    <polygon points="35,12 68,35 35,58 53,35" fill="#f59e0b" opacity="0.8" />
    <!-- Banner Title -->
    <text x="600" y="46" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">SKEMA STRUKTUR TABEL DATABASE (PHYSICAL MODEL)</text>
  </g>


  <!-- ================= FK RELATION LINES ================= -->
  <g stroke="#94a3b8" stroke-width="1.8" fill="none">
    <!-- tefa_units to catalog_items -->
    <path d="M 520 280 L 520 400" marker-end="url(#fk-arrow)" />
    <!-- catalog_items to order_items -->
    <path d="M 520 700 L 520 780" marker-end="url(#fk-arrow)" />
    <!-- orders to order_items -->
    <path d="M 880 780 L 670 780" marker-end="url(#fk-arrow)" />
    <!-- users to orders -->
    <path d="M 1030 400 L 1030 500" marker-end="url(#fk-arrow)" />
    <!-- projects to orders -->
    <path d="M 1250 540 L 1180 540" marker-end="url(#fk-arrow)" />
    <!-- projects to tasks -->
    <path d="M 1400 710 L 1400 780" marker-end="url(#fk-arrow)" />
    <!-- worker_profiles to tasks -->
    <path d="M 1400 400 L 1400 490" marker-end="url(#fk-arrow)" />
    <!-- users to worker_profiles -->
    <path d="M 1180 270 L 1250 270" marker-end="url(#fk-arrow)" />
    <!-- tefa_units to categories -->
    <path d="M 370 270 L 300 270" marker-end="url(#fk-arrow)" />
  </g>


  <!-- ================= TABLE 1: TEFA_UNITS ================= -->
  <g transform="translate(370, 140)" filter="url(#tbl-shadow)">
    <!-- Table Header -->
    <rect x="0" y="0" width="300" height="35" rx="6" fill="#0b2545" />
    <text x="15" y="23" font-size="14" font-weight="800" fill="#ffffff">🗄️ tefa_units</text>
    <!-- Table Body -->
    <rect x="0" y="35" width="300" height="150" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <g font-size="11" transform="translate(12, 55)">
      <text y="0" font-weight="700" fill="#b45309">🔑 id</text><text x="180" y="0" fill="#64748b">UUID (PK)</text>
      <text y="20" font-weight="600" fill="#0b2545">name</text><text x="180" y="20" fill="#64748b">VARCHAR(255)</text>
      <text y="40" font-weight="600" fill="#0b2545">slug</text><text x="180" y="40" fill="#64748b">VARCHAR(255) (UQ)</text>
      <text y="60" fill="#334155">logo_url, banner_url</text><text x="180" y="60" fill="#64748b">VARCHAR(255)</text>
      <text y="80" fill="#334155">contact_info</text><text x="180" y="80" fill="#64748b">JSON</text>
      <text y="100" fill="#334155">is_active</text><text x="180" y="100" fill="#64748b">BOOLEAN</text>
      <text y="120" fill="#94a3b8">created_at, updated_at</text><text x="180" y="120" fill="#64748b">TIMESTAMP</text>
    </g>
  </g>


  <!-- ================= TABLE 2: CATEGORIES ================= -->
  <g transform="translate(70, 200)" filter="url(#tbl-shadow)">
    <rect x="0" y="0" width="230" height="35" rx="6" fill="#0b2545" />
    <text x="15" y="23" font-size="14" font-weight="800" fill="#ffffff">🗄️ categories</text>
    <rect x="0" y="35" width="230" height="115" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <g font-size="11" transform="translate(12, 55)">
      <text y="0" font-weight="700" fill="#b45309">🔑 id</text><text x="140" y="0" fill="#64748b">BIGINT (PK)</text>
      <text y="20" font-weight="700" fill="#2563eb">🔗 tefa_unit_id</text><text x="140" y="20" fill="#64748b">UUID (FK)</text>
      <text y="40" font-weight="600" fill="#0b2545">name</text><text x="140" y="40" fill="#64748b">VARCHAR(255)</text>
      <text y="60" fill="#334155">type</text><text x="140" y="60" fill="#64748b">VARCHAR(50)</text>
      <text y="80" fill="#334155">image</text><text x="140" y="80" fill="#64748b">VARCHAR(255)</text>
    </g>
  </g>


  <!-- ================= TABLE 3: CATALOG_ITEMS ================= -->
  <g transform="translate(370, 400)" filter="url(#tbl-shadow)">
    <rect x="0" y="0" width="300" height="35" rx="6" fill="#0b2545" />
    <text x="15" y="23" font-size="14" font-weight="800" fill="#ffffff">🗄️ catalog_items</text>
    <rect x="0" y="35" width="300" height="235" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <g font-size="11" transform="translate(12, 55)">
      <text y="0" font-weight="700" fill="#b45309">🔑 id</text><text x="180" y="0" fill="#64748b">UUID (PK)</text>
      <text y="20" font-weight="700" fill="#2563eb">🔗 tefa_unit_id</text><text x="180" y="20" fill="#64748b">UUID (FK)</text>
      <text y="40" font-weight="600" fill="#0b2545">title, slug</text><text x="180" y="40" fill="#64748b">VARCHAR(255)</text>
      <text y="60" fill="#334155">price</text><text x="180" y="60" fill="#64748b">DECIMAL(15,2)</text>
      <text y="80" fill="#334155">stock, track_stock</text><text x="180" y="80" fill="#64748b">INT, BOOLEAN</text>
      <text y="100" fill="#334155">item_type</text><text x="180" y="100" fill="#64748b">VARCHAR(50)</text>
      <text y="120" fill="#334155">fulfillment_type</text><text x="180" y="120" fill="#64748b">VARCHAR(50)</text>
      <text y="140" fill="#334155">digital_file_url</text><text x="180" y="140" fill="#64748b">VARCHAR(255)</text>
      <text y="160" fill="#334155">weight_gram</text><text x="180" y="160" fill="#64748b">INT NULL</text>
      <text y="180" fill="#334155">status</text><text x="180" y="180" fill="#64748b">ENUM(draft,pub..)</text>
      <text y="200" fill="#94a3b8">created_at, updated_at</text><text x="180" y="200" fill="#64748b">TIMESTAMP</text>
    </g>
  </g>


  <!-- ================= TABLE 4: ORDER_ITEMS ================= -->
  <g transform="translate(370, 780)" filter="url(#tbl-shadow)">
    <rect x="0" y="0" width="300" height="35" rx="6" fill="#0b2545" />
    <text x="15" y="23" font-size="14" font-weight="800" fill="#ffffff">🗄️ order_items</text>
    <rect x="0" y="35" width="300" height="175" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <g font-size="11" transform="translate(12, 55)">
      <text y="0" font-weight="700" fill="#b45309">🔑 id</text><text x="180" y="0" fill="#64748b">BIGINT (PK)</text>
      <text y="20" font-weight="700" fill="#2563eb">🔗 order_id</text><text x="180" y="20" fill="#64748b">UUID (FK)</text>
      <text y="40" font-weight="700" fill="#2563eb">🔗 catalog_item_id</text><text x="180" y="40" fill="#64748b">UUID (FK)</text>
      <text y="60" font-weight="600" fill="#0b2545">item_title</text><text x="180" y="60" fill="#64748b">VARCHAR(255)</text>
      <text y="80" fill="#334155">unit_price, price_purchase</text><text x="180" y="80" fill="#64748b">DECIMAL(15,2)</text>
      <text y="100" fill="#334155">quantity</text><text x="180" y="100" fill="#64748b">INT</text>
      <text y="120" fill="#334155">subtotal</text><text x="180" y="120" fill="#64748b">DECIMAL(15,2)</text>
      <text y="140" fill="#94a3b8">created_at, updated_at</text><text x="180" y="140" fill="#64748b">TIMESTAMP</text>
    </g>
  </g>


  <!-- ================= TABLE 5: USERS ================= -->
  <g transform="translate(880, 140)" filter="url(#tbl-shadow)">
    <rect x="0" y="0" width="300" height="35" rx="6" fill="#0b2545" />
    <text x="15" y="23" font-size="14" font-weight="800" fill="#ffffff">🗄️ users</text>
    <rect x="0" y="35" width="300" height="195" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <g font-size="11" transform="translate(12, 55)">
      <text y="0" font-weight="700" fill="#b45309">🔑 id</text><text x="180" y="0" fill="#64748b">UUID (PK)</text>
      <text y="20" font-weight="600" fill="#0b2545">name</text><text x="180" y="20" fill="#64748b">VARCHAR(255)</text>
      <text y="40" font-weight="600" fill="#0b2545">email</text><text x="180" y="40" fill="#64748b">VARCHAR(255) (UQ)</text>
      <text y="60" font-weight="600" fill="#2563eb">whatsapp_number</text><text x="180" y="60" fill="#64748b">VARCHAR(25) NULL</text>
      <text y="80" fill="#334155">phone</text><text x="180" y="80" fill="#64748b">VARCHAR(255)</text>
      <text y="100" fill="#334155">password</text><text x="180" y="100" fill="#64748b">VARCHAR(255)</text>
      <text y="120" fill="#0b2545" font-weight="700">role</text><text x="180" y="120" fill="#64748b">ENUM(super,admin..)</text>
      <text y="140" fill="#334155">remember_token</text><text x="180" y="140" fill="#64748b">VARCHAR(100)</text>
      <text y="160" fill="#94a3b8">created_at, updated_at</text><text x="180" y="160" fill="#64748b">TIMESTAMP</text>
    </g>
  </g>


  <!-- ================= TABLE 6: ORDERS ================= -->
  <g transform="translate(880, 500)" filter="url(#tbl-shadow)">
    <rect x="0" y="0" width="300" height="35" rx="6" fill="#0b2545" />
    <text x="15" y="23" font-size="14" font-weight="800" fill="#ffffff">🗄️ orders</text>
    <rect x="0" y="35" width="300" height="295" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <g font-size="11" transform="translate(12, 55)">
      <text y="0" font-weight="700" fill="#b45309">🔑 id</text><text x="180" y="0" fill="#64748b">UUID (PK)</text>
      <text y="20" font-weight="700" fill="#2563eb">🔗 tefa_unit_id</text><text x="180" y="20" fill="#64748b">UUID (FK)</text>
      <text y="40" font-weight="700" fill="#2563eb">🔗 user_id</text><text x="180" y="40" fill="#64748b">UUID (FK NULL)</text>
      <text y="60" font-weight="700" fill="#2563eb">🔗 project_id</text><text x="180" y="60" fill="#64748b">UUID (FK NULL)</text>
      <text y="80" font-weight="600" fill="#0b2545">customer_name, contact</text><text x="180" y="80" fill="#64748b">VARCHAR(255)</text>
      <text y="100" fill="#334155">order_type</text><text x="180" y="100" fill="#64748b">ENUM(physical,jasa..)</text>
      <text y="120" fill="#334155">fulfillment_method</text><text x="180" y="120" fill="#64748b">ENUM(delivery,pickup..)</text>
      <text y="140" fill="#334155">shipping_address, city</text><text x="180" y="140" fill="#64748b">TEXT, VARCHAR</text>
      <text y="160" fill="#334155">shipping_cost, total_price</text><text x="180" y="160" fill="#64748b">DECIMAL(15,2)</text>
      <text y="180" fill="#334155">payment_method, status</text><text x="180" y="180" fill="#64748b">VARCHAR, ENUM</text>
      <text y="200" fill="#334155">payment_proof_url</text><text x="180" y="200" fill="#64748b">VARCHAR(255)</text>
      <text y="220" fill="#334155">fulfillment_status, tracking</text><text x="180" y="220" fill="#64748b">VARCHAR(255)</text>
      <text y="240" fill="#334155">digital_access_token</text><text x="180" y="240" fill="#64748b">VARCHAR(255)</text>
      <text y="260" fill="#94a3b8">created_at, updated_at</text><text x="180" y="260" fill="#64748b">TIMESTAMP</text>
    </g>
  </g>


  <!-- ================= TABLE 7: WORKER_PROFILES ================= -->
  <g transform="translate(1250, 140)" filter="url(#tbl-shadow)">
    <rect x="0" y="0" width="300" height="35" rx="6" fill="#0b2545" />
    <text x="15" y="23" font-size="14" font-weight="800" fill="#ffffff">🗄️ worker_profiles</text>
    <rect x="0" y="35" width="300" height="155" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <g font-size="11" transform="translate(12, 55)">
      <text y="0" font-weight="700" fill="#b45309">🔑 id</text><text x="180" y="0" fill="#64748b">UUID (PK)</text>
      <text y="20" font-weight="700" fill="#2563eb">🔗 user_id</text><text x="180" y="20" fill="#64748b">UUID (FK UQ)</text>
      <text y="40" font-weight="700" fill="#2563eb">🔗 tefa_unit_id</text><text x="180" y="40" fill="#64748b">UUID (FK)</text>
      <text y="60" font-weight="600" fill="#0b2545">nisn, class_name</text><text x="180" y="60" fill="#64748b">VARCHAR(255)</text>
      <text y="80" fill="#334155">bio, avatar_url</text><text x="180" y="80" fill="#64748b">TEXT, VARCHAR</text>
      <text y="100" fill="#94a3b8">created_at, updated_at</text><text x="180" y="100" fill="#64748b">TIMESTAMP</text>
    </g>
  </g>


  <!-- ================= TABLE 8: PROJECTS ================= -->
  <g transform="translate(1250, 480)" filter="url(#tbl-shadow)">
    <rect x="0" y="0" width="300" height="35" rx="6" fill="#0b2545" />
    <text x="15" y="23" font-size="14" font-weight="800" fill="#ffffff">🗄️ projects</text>
    <rect x="0" y="35" width="300" height="215" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <g font-size="11" transform="translate(12, 55)">
      <text y="0" font-weight="700" fill="#b45309">🔑 id</text><text x="180" y="0" fill="#64748b">UUID (PK)</text>
      <text y="20" font-weight="700" fill="#2563eb">🔗 tefa_unit_id</text><text x="180" y="20" fill="#64748b">UUID (FK)</text>
      <text y="40" font-weight="700" fill="#2563eb">🔗 created_by</text><text x="180" y="40" fill="#64748b">UUID (FK users)</text>
      <text y="60" font-weight="600" fill="#0b2545">title, client_name</text><text x="180" y="60" fill="#64748b">VARCHAR(255)</text>
      <text y="80" fill="#334155">client_contact</text><text x="180" y="80" fill="#64748b">VARCHAR(255)</text>
      <text y="100" fill="#334155">estimated_price, final_price</text><text x="180" y="100" fill="#64748b">DECIMAL(15,2)</text>
      <text y="120" fill="#334155">ai_extraction_data</text><text x="180" y="120" fill="#64748b">JSON NULL</text>
      <text y="140" fill="#334155">status</text><text x="180" y="140" fill="#64748b">ENUM(draft,active..)</text>
      <text y="160" fill="#334155">deadline</text><text x="180" y="160" fill="#64748b">DATE NULL</text>
      <text y="180" fill="#94a3b8">created_at, updated_at</text><text x="180" y="180" fill="#64748b">TIMESTAMP</text>
    </g>
  </g>


  <!-- ================= TABLE 9: TASKS ================= -->
  <g transform="translate(1250, 750)" filter="url(#tbl-shadow)">
    <rect x="0" y="0" width="300" height="35" rx="6" fill="#0b2545" />
    <text x="15" y="23" font-size="14" font-weight="800" fill="#ffffff">🗄️ tasks</text>
    <rect x="0" y="35" width="300" height="235" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <g font-size="11" transform="translate(12, 55)">
      <text y="0" font-weight="700" fill="#b45309">🔑 id</text><text x="180" y="0" fill="#64748b">UUID (PK)</text>
      <text y="20" font-weight="700" fill="#2563eb">🔗 project_id</text><text x="180" y="20" fill="#64748b">UUID (FK)</text>
      <text y="40" font-weight="700" fill="#2563eb">🔗 leader_id</text><text x="180" y="40" fill="#64748b">UUID (FK worker)</text>
      <text y="60" font-weight="600" fill="#0b2545">title</text><text x="180" y="60" fill="#64748b">VARCHAR(255)</text>
      <text y="80" fill="#334155">goals, team_notes</text><text x="180" y="80" fill="#64748b">TEXT</text>
      <text y="100" fill="#334155">progress_percentage</text><text x="180" y="100" fill="#64748b">INT (0-100)</text>
      <text y="120" fill="#334155">status</text><text x="180" y="120" fill="#64748b">ENUM(todo,in_prog..)</text>
      <text y="140" fill="#334155">priority</text><text x="180" y="140" fill="#64748b">ENUM(low,med,high)</text>
      <text y="160" fill="#334155">proof_file_url, notes</text><text x="180" y="160" fill="#64748b">VARCHAR, TEXT</text>
      <text y="180" fill="#334155">completed_at</text><text x="180" y="180" fill="#64748b">TIMESTAMP NULL</text>
      <text y="200" fill="#94a3b8">created_at, updated_at</text><text x="180" y="200" fill="#64748b">TIMESTAMP</text>
    </g>
  </g>


  <!-- ================= TABLE 10: PIVOT & EXTRA (task_worker & wa_import_drafts) ================= -->
  <g transform="translate(1580, 520)" filter="url(#tbl-shadow)">
    <rect x="0" y="0" width="220" height="30" rx="4" fill="#0b2545" />
    <text x="12" y="20" font-size="12" font-weight="700" fill="#ffffff">🗄️ task_worker (Pivot)</text>
    <rect x="0" y="30" width="220" height="90" fill="#ffffff" stroke="#cbd5e1" />
    <g font-size="10" transform="translate(10, 48)">
      <text y="0" font-weight="700" fill="#2563eb">🔗 task_id (FK)</text>
      <text y="18" font-weight="700" fill="#2563eb">🔗 worker_profile_id (FK)</text>
      <text y="36" fill="#334155">member_task_note (TEXT)</text>
    </g>
  </g>

  <g transform="translate(1580, 680)" filter="url(#tbl-shadow)">
    <rect x="0" y="0" width="220" height="30" rx="4" fill="#d97706" />
    <text x="12" y="20" font-size="12" font-weight="700" fill="#ffffff">🤖 wa_import_drafts</text>
    <rect x="0" y="30" width="220" height="120" fill="#ffffff" stroke="#cbd5e1" />
    <g font-size="10" transform="translate(10, 48)">
      <text y="0" font-weight="700" fill="#b45309">🔑 id (BIGINT)</text>
      <text y="18" font-weight="700" fill="#2563eb">🔗 project_id, tefa_unit_id</text>
      <text y="36" fill="#334155">chat_file_path (VARCHAR)</text>
      <text y="54" fill="#334155">ai_result (JSON)</text>
      <text y="72" fill="#334155">status (processing..)</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 930)">
    <rect x="0" y="0" width="260" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="15" y="22" font-size="12" font-weight="700" fill="#0b2545">Keterangan Relasi:</text>
    <text x="15" y="42" font-size="11" font-weight="700" fill="#b45309">🔑 Primary Key (PK)</text>
    <text x="140" y="42" font-size="11" font-weight="700" fill="#2563eb">🔗 Foreign Key (FK)</text>
  </g>

</svg>
