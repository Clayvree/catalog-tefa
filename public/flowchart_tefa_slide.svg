<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0b2545" />
    </marker>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0b2545" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ================= BACKGROUND DECORATIONS (MATCHING TEMPLATE) ================= -->
  <!-- Top-Left Accent -->
  <g transform="translate(40, 30)">
    <rect x="0" y="40" width="14" height="90" rx="7" transform="rotate(-45 0 40)" fill="#f59e0b" />
    <rect x="35" y="20" width="16" height="130" rx="8" transform="rotate(-45 35 20)" fill="#0b2545" />
    <rect x="75" y="10" width="12" height="70" rx="6" transform="rotate(-45 75 10)" fill="#1e3a8a" />
    <g fill="#0b2545" opacity="0.85">
      <circle cx="10" cy="130" r="4" /><circle cx="30" cy="130" r="4" /><circle cx="50" cy="130" r="4" /><circle cx="70" cy="130" r="4" />
      <circle cx="10" cy="150" r="4" /><circle cx="30" cy="150" r="4" /><circle cx="50" cy="150" r="4" /><circle cx="70" cy="150" r="4" />
      <circle cx="10" cy="170" r="4" /><circle cx="30" cy="170" r="4" /><circle cx="50" cy="170" r="4" /><circle cx="70" cy="170" r="4" />
    </g>
  </g>

  <!-- Bottom-Right Accent -->
  <g transform="translate(1720, 880)">
    <circle cx="120" cy="120" r="90" fill="none" stroke="#0b2545" stroke-width="18" />
    <path d="M 40 140 A 100 100 0 0 1 140 40" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" />
    <circle cx="10" cy="60" r="14" fill="#0b2545" />
    <circle cx="-20" cy="110" r="10" fill="#f59e0b" />
    <circle cx="30" cy="140" r="8" fill="#1e3a8a" />
    <g fill="#0b2545" opacity="0.85">
      <circle cx="10" cy="170" r="4" /><circle cx="30" cy="170" r="4" /><circle cx="50" cy="170" r="4" />
      <circle cx="10" cy="190" r="4" /><circle cx="30" cy="190" r="4" /><circle cx="50" cy="190" r="4" />
      <circle cx="10" cy="210" r="4" /><circle cx="30" cy="210" r="4" /><circle cx="50" cy="210" r="4" />
    </g>
  </g>

  <!-- ================= TOP HEADER BANNER ================= -->
  <g transform="translate(430, 35)">
    <rect x="0" y="0" width="1060" height="70" rx="8" fill="#0b2545" filter="url(#shadow2)" />
    <!-- Yellow Accent Chevron on Left -->
    <polygon points="12,12 45,35 12,58 30,35" fill="#f59e0b" />
    <polygon points="35,12 68,35 35,58 53,35" fill="#f59e0b" opacity="0.8" />
    <!-- Banner Title -->
    <text x="550" y="46" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">FLOWCHART ALUR SISTEM &amp; TRANSAKSI TEFA</text>
  </g>

  <!-- ================= 4 SWIMLANES / PHASES BACKGROUND ================= -->
  <g transform="translate(180, 140)">
    <!-- Phase 1: Klien / Pelanggan -->
    <rect x="0" y="0" width="370" height="880" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="0" y="0" width="370" height="50" rx="12" fill="#0b2545" />
    <text x="185" y="32" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1. PEMESAN / PELANGGAN</text>

    <!-- Phase 2: Transaksi & Otomasi -->
    <rect x="390" y="0" width="370" height="880" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="390" y="0" width="370" height="50" rx="12" fill="#0b2545" />
    <text x="575" y="32" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2. ORDER &amp; CHECKOUT</text>

    <!-- Phase 3: AI Import & Admin TEFA -->
    <rect x="780" y="0" width="390" height="880" rx="12" fill="#fffbeb" stroke="#fef3c7" stroke-width="1.5" />
    <rect x="780" y="0" width="390" height="50" rx="12" fill="#d97706" />
    <text x="975" y="32" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3. ADMIN &amp; AI IMPORT (GROQ)</text>

    <!-- Phase 4: Siswa / Worker -->
    <rect x="1190" y="0" width="370" height="880" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="1190" y="0" width="370" height="50" rx="12" fill="#0b2545" />
    <text x="1375" y="32" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4. SISWA / WORKER TEFA</text>
  </g>


  <!-- ================= FLOW NODES & CONNECTORS ================= -->
  <!-- START NODE -->
  <g transform="translate(305, 215)">
    <rect x="0" y="0" width="120" height="42" rx="21" fill="#10b981" filter="url(#shadow2)" />
    <text x="60" y="26" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">MULAI</text>
  </g>

  <!-- Connect to Catalog -->
  <line x1="365" y1="257" x2="365" y2="295" stroke="#0b2545" stroke-width="2.5" marker-end="url(#flow-arrow)" />

  <!-- NODE: BROWSE KATALOG -->
  <g transform="translate(245, 295)">
    <rect x="0" y="0" width="240" height="60" rx="8" fill="#ffffff" stroke="#0b2545" stroke-width="2" filter="url(#shadow2)" />
    <text x="120" y="27" font-size="14" font-weight="700" fill="#0b2545" text-anchor="middle">Buka Katalog TEFA</text>
    <text x="120" y="47" font-size="12" fill="#64748b" text-anchor="middle">Pilih Produk Fisik / Digital / Jasa</text>
  </g>

  <!-- Connect to Decision -->
  <line x1="365" y1="355" x2="365" y2="400" stroke="#0b2545" stroke-width="2.5" marker-end="url(#flow-arrow)" />

  <!-- DECISION: TIPE ITEM? -->
  <g transform="translate(365, 460)">
    <polygon points="0,-45 80,0 0,45 -80,0" fill="#ffffff" stroke="#0b2545" stroke-width="2" filter="url(#shadow2)" />
    <text x="0" y="-5" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Tipe Item?</text>
    <text x="0" y="15" font-size="11" fill="#64748b" text-anchor="middle">Fisik / Jasa</text>
  </g>

  <!-- PATH A: PRODUK FISIK / DIGITAL (KE KANAN) -->
  <path d="M 445 460 L 620 460 L 620 355" stroke="#0b2545" stroke-width="2.5" fill="none" marker-end="url(#flow-arrow)" />
  <text x="490" y="445" font-size="12" font-weight="700" fill="#0b2545">Fisik / Digital</text>

  <!-- NODE: CHECKOUT REGULER -->
  <g transform="translate(635, 295)">
    <rect x="0" y="0" width="240" height="60" rx="8" fill="#ffffff" stroke="#0b2545" stroke-width="2" filter="url(#shadow2)" />
    <text x="120" y="27" font-size="14" font-weight="700" fill="#0b2545" text-anchor="middle">Checkout Pesanan</text>
    <text x="120" y="47" font-size="12" fill="#64748b" text-anchor="middle">Alamat Pengiriman + Ongkir</text>
  </g>

  <line x1="755" y1="355" x2="755" y2="405" stroke="#0b2545" stroke-width="2.5" marker-end="url(#flow-arrow)" />

  <!-- NODE: PEMBAYARAN QRIS / TRANSFER -->
  <g transform="translate(635, 405)">
    <rect x="0" y="0" width="240" height="60" rx="8" fill="#ffffff" stroke="#0b2545" stroke-width="2" filter="url(#shadow2)" />
    <text x="120" y="27" font-size="14" font-weight="700" fill="#0b2545" text-anchor="middle">Pembayaran (QRIS/Bank)</text>
    <text x="120" y="47" font-size="12" fill="#64748b" text-anchor="middle">Upload Bukti / Verifikasi Admin</text>
  </g>

  <line x1="755" y1="465" x2="755" y2="520" stroke="#0b2545" stroke-width="2.5" marker-end="url(#flow-arrow)" />

  <!-- NODE: SELESAI FISIK / DIGITAL -->
  <g transform="translate(635, 520)">
    <rect x="0" y="0" width="240" height="65" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadow2)" />
    <text x="120" y="28" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">Pesanan Diproses / Selesai</text>
    <text x="120" y="48" font-size="12" fill="#047857" text-anchor="middle">Kirim Resi / Download Link Aktif</text>
  </g>


  <!-- PATH B: JASA / PROYEK NEGO (KE BAWAH) -->
  <line x1="365" y1="505" x2="365" y2="560" stroke="#0b2545" stroke-width="2.5" marker-end="url(#flow-arrow)" />
  <text x="375" y="535" font-size="12" font-weight="700" fill="#0b2545">Jasa/Proyek</text>

  <!-- NODE: NEGO WHATSAPP OTOMATIS -->
  <g transform="translate(245, 560)">
    <rect x="0" y="0" width="240" height="65" rx="8" fill="#ffffff" stroke="#25d366" stroke-width="2.5" filter="url(#shadow2)" />
    <text x="120" y="28" font-size="14" font-weight="700" fill="#075e54" text-anchor="middle">💬 Pengajuan Jasa via WA</text>
    <text x="120" y="48" font-size="12" fill="#64748b" text-anchor="middle">Pre-filled Chat ke Admin TEFA</text>
  </g>

  <!-- DUAL DB TRANSACTION (ORDER & PROJECT CREATED DRAFT) -->
  <line x1="365" y1="625" x2="365" y2="685" stroke="#0b2545" stroke-width="2.5" marker-end="url(#flow-arrow)" />

  <g transform="translate(245, 685)">
    <rect x="0" y="0" width="240" height="65" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow2)" />
    <text x="120" y="28" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">Sync Transaksi Ganda (DB)</text>
    <text x="120" y="48" font-size="11" fill="#475569" text-anchor="middle">Orders (Pending) + Projects (Draft)</text>
  </g>

  <!-- CONNECT TO AI IMPORT PHASE -->
  <path d="M 485 717 L 1020 717 L 1020 295" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6,4" fill="none" marker-end="url(#flow-arrow)" />
  <text x="540" y="705" font-size="12" font-weight="700" fill="#d97706">Kesepakatan Chat WA Selesai</text>

  <!-- NODE: UPLOAD CHAT WA KE AI -->
  <g transform="translate(1030, 295)">
    <rect x="0" y="0" width="250" height="65" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#shadow2)" />
    <text x="125" y="28" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">🤖 Export &amp; Upload Chat WA</text>
    <text x="125" y="48" font-size="12" fill="#64748b" text-anchor="middle">Format .txt ke Detail Proyek</text>
  </g>

  <line x1="1155" y1="360" x2="1155" y2="410" stroke="#d97706" stroke-width="2.5" marker-end="url(#flow-arrow)" />

  <!-- NODE: GROQ AI EXTRACTION & SKILL MATCHING -->
  <g transform="translate(1030, 410)">
    <rect x="0" y="0" width="250" height="80" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" filter="url(#shadow2)" />
    <text x="125" y="26" font-size="14" font-weight="800" fill="#92400e" text-anchor="middle">AI Ekstraksi &amp; Delegasi</text>
    <text x="125" y="46" font-size="11" fill="#78350f" text-anchor="middle">• Judul &amp; Harga Deal Final</text>
    <text x="125" y="64" font-size="11" fill="#78350f" text-anchor="middle">• Pecah Tugas &amp; Cocokkan Skill</text>
  </g>

  <line x1="1155" y1="490" x2="1155" y2="540" stroke="#d97706" stroke-width="2.5" marker-end="url(#flow-arrow)" />

  <!-- NODE: REVIEW & KONFIRMASI ADMIN -->
  <g transform="translate(1030, 540)">
    <rect x="0" y="0" width="250" height="65" rx="8" fill="#ffffff" stroke="#0b2545" stroke-width="2" filter="url(#shadow2)" />
    <text x="125" y="28" font-size="14" font-weight="700" fill="#0b2545" text-anchor="middle">Review &amp; Konfirmasi Admin</text>
    <text x="125" y="48" font-size="12" fill="#64748b" text-anchor="middle">Update Project &amp; Sync Order Price</text>
  </g>

  <!-- CONNECT TO SISWA / WORKER PHASE -->
  <line x1="1280" y1="572" x2="1435" y2="572" stroke="#0b2545" stroke-width="2.5" marker-end="url(#flow-arrow)" />

  <!-- NODE: SISWA TERIMA TUGAS -->
  <g transform="translate(1440, 540)">
    <rect x="0" y="0" width="230" height="65" rx="8" fill="#ffffff" stroke="#0b2545" stroke-width="2" filter="url(#shadow2)" />
    <text x="115" y="28" font-size="14" font-weight="700" fill="#0b2545" text-anchor="middle">Notifikasi Tugas Masuk</text>
    <text x="115" y="48" font-size="12" fill="#64748b" text-anchor="middle">Leader &amp; Anggota Tim Siswa</text>
  </g>

  <line x1="1555" y1="605" x2="1555" y2="655" stroke="#0b2545" stroke-width="2.5" marker-end="url(#flow-arrow)" />

  <!-- NODE: PROGRES & TEAM NOTES -->
  <g transform="translate(1440, 655)">
    <rect x="0" y="0" width="230" height="70" rx="8" fill="#ffffff" stroke="#0b2545" stroke-width="2" filter="url(#shadow2)" />
    <text x="115" y="26" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Kolaborasi &amp; Eksekusi</text>
    <text x="115" y="45" font-size="11" fill="#64748b" text-anchor="middle">Update Slider % Progress</text>
    <text x="115" y="61" font-size="11" fill="#64748b" text-anchor="middle">Isi Catatan Kolaborasi Tim</text>
  </g>

  <line x1="1555" y1="725" x2="1555" y2="775" stroke="#0b2545" stroke-width="2.5" marker-end="url(#flow-arrow)" />

  <!-- NODE: UPLOAD BUKTI & REVIEW -->
  <g transform="translate(1440, 775)">
    <rect x="0" y="0" width="230" height="65" rx="8" fill="#ffffff" stroke="#0b2545" stroke-width="2" filter="url(#shadow2)" />
    <text x="115" y="28" font-size="13" font-weight="700" fill="#0b2545" text-anchor="middle">Kirim Bukti Pengerjaan</text>
    <text x="115" y="48" font-size="11" fill="#64748b" text-anchor="middle">File/URL Link → Status 'Review'</text>
  </g>

  <!-- CONNECT TO ADMIN VERIFIKASI -->
  <path d="M 1440 807 L 1155 807 L 1155 690" stroke="#0b2545" stroke-width="2.5" fill="none" marker-end="url(#flow-arrow)" />

  <!-- NODE: VERIFIKASI GURU / ADMIN -->
  <g transform="translate(1030, 690)">
    <rect x="0" y="0" width="250" height="65" rx="8" fill="#ffffff" stroke="#0b2545" stroke-width="2" filter="url(#shadow2)" />
    <text x="125" y="28" font-size="14" font-weight="700" fill="#0b2545" text-anchor="middle">Verifikasi Guru / Admin</text>
    <text x="125" y="48" font-size="12" fill="#64748b" text-anchor="middle">Task 'Done' &amp; Portofolio Siswa</text>
  </g>

  <!-- FINAL DELIVERY -->
  <line x1="1030" y1="722" x2="875" y2="722" stroke="#10b981" stroke-width="2.5" marker-end="url(#flow-arrow)" />

  <!-- END NODE -->
  <g transform="translate(685, 690)">
    <rect x="0" y="0" width="190" height="65" rx="10" fill="#10b981" filter="url(#shadow2)" />
    <text x="95" y="28" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">PROYEK SELESAI</text>
    <text x="95" y="48" font-size="11" fill="#ecfdf5" text-anchor="middle">Serah Terima &amp; Pelunasan</text>
  </g>

</svg>
