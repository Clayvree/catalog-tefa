<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- UML Association Open Arrow -->
    <marker id="uml-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0b2545" />
    </marker>
    <!-- UML Composition Diamond -->
    <marker id="uml-comp" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,6 6,1 12,6 6,11" fill="#0b2545" />
    </marker>
    <!-- UML Aggregation White Diamond -->
    <marker id="uml-aggr" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,6 6,1 12,6 6,11" fill="#ffffff" stroke="#0b2545" stroke-width="1.5" />
    </marker>
    <filter id="uml-shadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#0b2545" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- ================= BACKGROUND DECORATIONS (MATCHING TEMPLATE) ================= -->
  <!-- Top-Left Accent -->
  <g transform="translate(40, 30)">
    <rect x="0" y="40" width="14" height="90" rx="7" transform="rotate(-45 0 40)" fill="#f59e0b" />
    <rect x="35" y="20" width="16" height="130" rx="8" transform="rotate(-45 35 20)" fill="#0b2545" />
    <rect x="75" y="10" width="12" height="70" rx="6" transform="rotate(-45 75 10)" fill="#1e3a8a" />
    <g fill="#0b2545" opacity="0.85">
      <circle cx="10" cy="130" r="4" /><circle cx="30" cy="130" r="4" /><circle cx="50" cy="130" r="4" /><circle cx="70" cy="130" r="4" />
      <circle cx="10" cy="150" r="4" /><circle cx="30" cy="150" r="4" /><circle cx="50" cy="150" r="4" /><circle cx="70" cy="150" r="4" />
      <circle cx="10" cy="170" r="4" /><circle cx="30" cy="170" r="4" /><circle cx="50" cy="170" r="4" /><circle cx="70" cy="170" r="4" />
    </g>
  </g>

  <!-- Bottom-Right Accent -->
  <g transform="translate(1720, 880)">
    <circle cx="120" cy="120" r="90" fill="none" stroke="#0b2545" stroke-width="18" />
    <path d="M 40 140 A 100 100 0 0 1 140 40" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" />
    <circle cx="10" cy="60" r="14" fill="#0b2545" />
    <circle cx="-20" cy="110" r="10" fill="#f59e0b" />
    <circle cx="30" cy="140" r="8" fill="#1e3a8a" />
    <g fill="#0b2545" opacity="0.85">
      <circle cx="10" cy="170" r="4" /><circle cx="30" cy="170" r="4" /><circle cx="50" cy="170" r="4" />
      <circle cx="10" cy="190" r="4" /><circle cx="30" cy="190" r="4" /><circle cx="50" cy="190" r="4" />
      <circle cx="10" cy="210" r="4" /><circle cx="30" cy="210" r="4" /><circle cx="50" cy="210" r="4" />
    </g>
  </g>

  <!-- ================= TOP HEADER BANNER ================= -->
  <g transform="translate(440, 35)">
    <rect x="0" y="0" width="1040" height="70" rx="8" fill="#0b2545" filter="url(#uml-shadow)" />
    <!-- Yellow Accent Chevron on Left -->
    <polygon points="12,12 45,35 12,58 30,35" fill="#f59e0b" />
    <polygon points="35,12 68,35 35,58 53,35" fill="#f59e0b" opacity="0.8" />
    <!-- Banner Title -->
    <text x="540" y="46" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">UML CLASS DIAGRAM (ARSITEKTUR SISTEM)</text>
  </g>


  <!-- ================= CONNECTOR LINES & MULTIPLICITY ================= -->
  <g stroke="#0b2545" stroke-width="1.8" fill="none">
    <!-- User to Order (1 to 0..*) -->
    <line x1="430" y1="365" x2="430" y2="475" marker-end="url(#uml-arrow)" />
    <text x="440" y="385" font-size="11" font-weight="700" fill="#0b2545">1</text>
    <text x="440" y="465" font-size="11" font-weight="700" fill="#0b2545">0..*</text>

    <!-- TefaUnit to CatalogItem (1 to *) -->
    <line x1="960" y1="365" x2="960" y2="475" marker-end="url(#uml-arrow)" />
    <text x="970" y="385" font-size="11" font-weight="700" fill="#0b2545">1</text>
    <text x="970" y="465" font-size="11" font-weight="700" fill="#0b2545">1..*</text>

    <!-- Order to OrderItem (Composition 1 to 1..*) -->
    <line x1="570" y1="620" x2="690" y2="620" marker-start="url(#uml-comp)" marker-end="url(#uml-arrow)" />
    <text x="590" y="612" font-size="11" font-weight="700" fill="#0b2545">1</text>
    <text x="665" y="612" font-size="11" font-weight="700" fill="#0b2545">1..*</text>

    <!-- CatalogItem to OrderItem (1 to *) -->
    <line x1="830" y1="620" x2="950" y2="620" marker-end="url(#uml-arrow)" />
    <text x="930" y="612" font-size="11" font-weight="700" fill="#0b2545">1</text>
    <text x="850" y="612" font-size="11" font-weight="700" fill="#0b2545">*</text>

    <!-- Order to Project (Association 0..1 to 0..1) -->
    <line x1="430" y1="765" x2="430" y2="825" marker-end="url(#uml-arrow)" />
    <text x="440" y="785" font-size="11" font-weight="700" fill="#0b2545">0..1</text>
    <text x="440" y="815" font-size="11" font-weight="700" fill="#0b2545">0..1 (Jasa)</text>

    <!-- Project to Task (Composition 1 to 1..*) -->
    <line x1="570" y1="910" x2="820" y2="910" marker-start="url(#uml-comp)" marker-end="url(#uml-arrow)" />
    <text x="590" y="902" font-size="11" font-weight="700" fill="#0b2545">1</text>
    <text x="795" y="902" font-size="11" font-weight="700" fill="#0b2545">1..*</text>

    <!-- User to WorkerProfile (1 to 0..1) -->
    <line x1="570" y1="240" x2="1350" y2="240" marker-end="url(#uml-arrow)" />
    <text x="600" y="232" font-size="11" font-weight="700" fill="#0b2545">1</text>
    <text x="1320" y="232" font-size="11" font-weight="700" fill="#0b2545">0..1 (Siswa)</text>

    <!-- WorkerProfile to Task (Leader 1 to *) -->
    <line x1="1470" y1="365" x2="1470" y2="910" stroke-dasharray="6,4" />
    <line x1="1470" y1="910" x2="1140" y2="910" marker-end="url(#uml-arrow)" />
    <text x="1170" y="902" font-size="11" font-weight="700" fill="#0b2545">1 (Leader) / * (Members)</text>

    <!-- WaImportAiService to Project / Task -->
    <line x1="1470" y1="620" x2="1120" y2="620" stroke-dasharray="4,4" marker-end="url(#uml-arrow)" />
    <text x="1190" y="612" font-size="10" font-weight="700" fill="#d97706">&lt;&lt;creates &amp; delegates&gt;&gt;</text>
  </g>


  <!-- ================= CLASS 1: USER ================= -->
  <g transform="translate(290, 140)" filter="url(#uml-shadow)">
    <!-- Class Header -->
    <rect x="0" y="0" width="280" height="42" rx="4" fill="#0b2545" />
    <text x="140" y="19" font-size="11" fill="#f59e0b" text-anchor="middle">&lt;&lt;Eloquent Model&gt;&gt;</text>
    <text x="140" y="35" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">User</text>
    <!-- Attributes -->
    <rect x="0" y="42" width="280" height="98" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10.5" fill="#334155" transform="translate(10, 58)">
      <text y="0">+ id: string (UUID)</text>
      <text y="16">+ name: string</text>
      <text y="32">+ email: string</text>
      <text y="48">+ whatsapp_number: string</text>
      <text y="64">+ role: UserRole (enum)</text>
    </g>
    <!-- Methods -->
    <rect x="0" y="140" width="280" height="85" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10.5" fill="#0b2545" transform="translate(10, 156)">
      <text y="0">+ workerProfile(): HasOne</text>
      <text y="16">+ orders(): HasMany</text>
      <text y="32">+ isStaff(): bool</text>
      <text y="48">+ isSuperAdmin(): bool</text>
    </g>
  </g>


  <!-- ================= CLASS 2: TEFA_UNIT ================= -->
  <g transform="translate(820, 140)" filter="url(#uml-shadow)">
    <rect x="0" y="0" width="280" height="42" rx="4" fill="#0b2545" />
    <text x="140" y="19" font-size="11" fill="#f59e0b" text-anchor="middle">&lt;&lt;Eloquent Model&gt;&gt;</text>
    <text x="140" y="35" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">TefaUnit</text>
    <rect x="0" y="42" width="280" height="98" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10.5" fill="#334155" transform="translate(10, 58)">
      <text y="0">+ id: string (UUID)</text>
      <text y="16">+ name: string</text>
      <text y="32">+ slug: string</text>
      <text y="48">+ logo_url: string</text>
      <text y="64">+ is_active: bool</text>
    </g>
    <rect x="0" y="140" width="280" height="85" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10.5" fill="#0b2545" transform="translate(10, 156)">
      <text y="0">+ catalogItems(): HasMany</text>
      <text y="16">+ projects(): HasMany</text>
      <text y="32">+ workerProfiles(): HasMany</text>
      <text y="48">+ admins(): BelongsToMany</text>
    </g>
  </g>


  <!-- ================= CLASS 3: WORKER_PROFILE ================= -->
  <g transform="translate(1350, 140)" filter="url(#uml-shadow)">
    <rect x="0" y="0" width="280" height="42" rx="4" fill="#0b2545" />
    <text x="140" y="19" font-size="11" fill="#f59e0b" text-anchor="middle">&lt;&lt;Eloquent Model&gt;&gt;</text>
    <text x="140" y="35" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">WorkerProfile</text>
    <rect x="0" y="42" width="280" height="98" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10.5" fill="#334155" transform="translate(10, 58)">
      <text y="0">+ id: string (UUID)</text>
      <text y="16">+ user_id: string (FK)</text>
      <text y="32">+ tefa_unit_id: string (FK)</text>
      <text y="48">+ nisn: string</text>
      <text y="64">+ class_name: string</text>
    </g>
    <rect x="0" y="140" width="280" height="85" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10.5" fill="#0b2545" transform="translate(10, 156)">
      <text y="0">+ skills(): BelongsToMany</text>
      <text y="16">+ ledTasks(): HasMany</text>
      <text y="32">+ memberTasks(): BelongsToMany</text>
      <text y="48">+ getTasksAttribute(): Collection</text>
    </g>
  </g>


  <!-- ================= CLASS 4: ORDER ================= -->
  <g transform="translate(290, 475)" filter="url(#uml-shadow)">
    <rect x="0" y="0" width="280" height="42" rx="4" fill="#0b2545" />
    <text x="140" y="19" font-size="11" fill="#f59e0b" text-anchor="middle">&lt;&lt;Eloquent Model&gt;&gt;</text>
    <text x="140" y="35" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Order</text>
    <rect x="0" y="42" width="280" height="140" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10.5" fill="#334155" transform="translate(10, 58)">
      <text y="0">+ id: string (UUID)</text>
      <text y="16">+ order_type: string (physical/service)</text>
      <text y="32">+ fulfillment_method: string</text>
      <text y="48">+ total_price: decimal</text>
      <text y="64">+ shipping_cost: decimal</text>
      <text y="80">+ payment_status: string</text>
      <text y="96">+ status: OrderStatus (enum)</text>
      <text y="112">+ digital_access_token: string</text>
    </g>
    <rect x="0" y="182" width="280" height="108" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10.5" fill="#0b2545" transform="translate(10, 198)">
      <text y="0">+ isDigital(): bool</text>
      <text y="16">+ isService(): bool</text>
      <text y="32">+ getGrandTotalAttribute(): float</text>
      <text y="48">+ items(): HasMany&lt;OrderItem&gt;</text>
      <text y="64">+ project(): BelongsTo&lt;Project&gt;</text>
    </g>
  </g>


  <!-- ================= CLASS 5: ORDER_ITEM ================= -->
  <g transform="translate(690, 530)" filter="url(#uml-shadow)">
    <rect x="0" y="0" width="220" height="38" rx="4" fill="#0b2545" />
    <text x="110" y="16" font-size="10" fill="#f59e0b" text-anchor="middle">&lt;&lt;Eloquent Model&gt;&gt;</text>
    <text x="110" y="30" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">OrderItem</text>
    <rect x="0" y="38" width="220" height="100" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10" fill="#334155" transform="translate(10, 52)">
      <text y="0">+ id: int</text>
      <text y="15">+ item_title: string</text>
      <text y="30">+ unit_price: decimal</text>
      <text y="45">+ quantity: int</text>
      <text y="60">+ subtotal: decimal</text>
      <text y="75">+ price_at_purchase: decimal</text>
    </g>
    <rect x="0" y="138" width="220" height="42" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="10" y="156" font-size="10" fill="#0b2545">+ order(): BelongsTo</text>
    <text x="10" y="171" font-size="10" fill="#0b2545">+ catalogItem(): BelongsTo</text>
  </g>


  <!-- ================= CLASS 6: CATALOG_ITEM ================= -->
  <g transform="translate(950, 475)" filter="url(#uml-shadow)">
    <rect x="0" y="0" width="280" height="42" rx="4" fill="#0b2545" />
    <text x="140" y="19" font-size="11" fill="#f59e0b" text-anchor="middle">&lt;&lt;Eloquent Model&gt;&gt;</text>
    <text x="140" y="35" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">CatalogItem</text>
    <rect x="0" y="42" width="280" height="140" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10.5" fill="#334155" transform="translate(10, 58)">
      <text y="0">+ id: string (UUID)</text>
      <text y="16">+ title: string</text>
      <text y="32">+ item_type: ItemType (enum)</text>
      <text y="48">+ price: decimal</text>
      <text y="64">+ stock: int</text>
      <text y="80">+ fulfillment_type: string</text>
      <text y="96">+ digital_file_url: string</text>
      <text y="112">+ status: ItemStatus (enum)</text>
    </g>
    <rect x="0" y="182" width="280" height="70" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10.5" fill="#0b2545" transform="translate(10, 198)">
      <text y="0">+ scopePublished($query)</text>
      <text y="16">+ isDigital(): bool</text>
      <text y="32">+ tefaUnit(): BelongsTo</text>
    </g>
  </g>


  <!-- ================= CLASS 7: WA_IMPORT_SERVICE (AI AGENT) ================= -->
  <g transform="translate(1350, 500)" filter="url(#uml-shadow)">
    <rect x="0" y="0" width="280" height="42" rx="4" fill="#d97706" />
    <text x="140" y="19" font-size="11" fill="#ffffff" text-anchor="middle">&lt;&lt;AI Service Engine&gt;&gt;</text>
    <text x="140" y="35" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">WaImportAiService</text>
    <rect x="0" y="42" width="280" height="70" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" />
    <g font-size="10.5" fill="#78350f" transform="translate(10, 58)">
      <text y="0">- groqEndpoint: string</text>
      <text y="16">- apiKey: string</text>
      <text y="32">- temperature: float = 0.1</text>
    </g>
    <rect x="0" y="112" width="280" height="80" fill="#ffffff" stroke="#fde68a" stroke-width="1.2" />
    <g font-size="10.5" fill="#b45309" transform="translate(10, 128)">
      <text y="0">+ process(draft: WaImportDraft): void</text>
      <text y="16">+ buildGroqPrompt(chat, workers): str</text>
      <text y="32">+ callGroq(prompt): string (JSON)</text>
    </g>
  </g>


  <!-- ================= CLASS 8: PROJECT ================= -->
  <g transform="translate(290, 825)" filter="url(#uml-shadow)">
    <rect x="0" y="0" width="280" height="42" rx="4" fill="#0b2545" />
    <text x="140" y="19" font-size="11" fill="#f59e0b" text-anchor="middle">&lt;&lt;Eloquent Model&gt;&gt;</text>
    <text x="140" y="35" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Project</text>
    <rect x="0" y="42" width="280" height="98" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10.5" fill="#334155" transform="translate(10, 58)">
      <text y="0">+ id: string (UUID)</text>
      <text y="16">+ title: string</text>
      <text y="32">+ client_name, client_contact: str</text>
      <text y="48">+ final_price: decimal</text>
      <text y="64">+ status: ProjectStatus (enum)</text>
    </g>
    <rect x="0" y="140" width="280" height="55" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10.5" fill="#0b2545" transform="translate(10, 156)">
      <text y="0">+ tasks(): HasMany&lt;Task&gt;</text>
      <text y="16">+ orders(): HasMany&lt;Order&gt;</text>
    </g>
  </g>


  <!-- ================= CLASS 9: TASK ================= -->
  <g transform="translate(820, 810)" filter="url(#uml-shadow)">
    <rect x="0" y="0" width="320" height="42" rx="4" fill="#0b2545" />
    <text x="160" y="19" font-size="11" fill="#f59e0b" text-anchor="middle">&lt;&lt;Eloquent Model&gt;&gt;</text>
    <text x="160" y="35" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Task</text>
    <rect x="0" y="42" width="320" height="110" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10.5" fill="#334155" transform="translate(10, 58)">
      <text y="0">+ id: string (UUID)</text>
      <text y="16">+ title: string</text>
      <text y="32">+ goals, team_notes: text</text>
      <text y="48">+ progress_percentage: int (0-100)</text>
      <text y="64">+ status: TaskStatus (todo/review/done)</text>
      <text y="80">+ proof_file_url, proof_notes: string</text>
    </g>
    <rect x="0" y="152" width="320" height="70" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <g font-size="10.5" fill="#0b2545" transform="translate(10, 168)">
      <text y="0">+ scopeForWorker($query, $workerId)</text>
      <text y="16">+ leader(): BelongsTo&lt;WorkerProfile&gt;</text>
      <text y="32">+ members(): BelongsToMany&lt;WorkerProfile&gt;</text>
    </g>
  </g>

</svg>
